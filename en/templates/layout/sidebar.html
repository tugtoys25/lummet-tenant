<aside class="sidebar">
  {{components_sidebar}}

  <div class="sidebar-block">
    <h3>Top Rated Casinos</h3>
    <div id="sidebarTopCasinos" class="sidebar-casinos">
      <p class="muted">Loading...</p>
    </div>
  </div>

  <div class="sidebar-block">
    <h3>Latest News</h3>
    <div id="sidebarNews" class="sidebar-news">
      <p class="muted">Loading...</p>
    </div>
  </div>

  <div class="sidebar-block">
    <h3>Browse by Country</h3>
    <div class="sidebar-search">
      <input type="text" id="sidebarCountrySearch" placeholder="Search country or code..." autocomplete="off">
    </div>
    <div class="country-chips" id="sidebarCountries">
      <p class="muted">Loading...</p>
    </div>
  </div>

  <div class="sidebar-block">
    <h3>Categories</h3>
    <div class="category-list" id="sidebarCategories">
      <p class="muted">Loading...</p>
    </div>
    <button class="btn btn--ghost btn--sm btn--block" id="sidebarCategoriesMore" style="display:none;margin-top:10px">Load More</button>
  </div>
</aside>

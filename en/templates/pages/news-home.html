{{components_top}}
<div class="news-list-page" style="padding:32px 0 80px">
  <div class="container">
    <link rel="stylesheet" href="/static/css/newsroom.css">
    <header style="margin-bottom:24px">
      <h1 style="font-size:clamp(32px,4vw,48px);margin:0 0 8px">{{page_title}}</h1>
      <p style="color:var(--gray);font-size:18px;margin:0 0 16px">{{page_description}}</p>
      <form method="GET" action="/en/news" role="search" style="display:flex;gap:10px">
        <input type="search" name="q" placeholder="Search news articles..." aria-label="Search news" style="flex:1;min-width:0;padding:12px 16px;border:1px solid var(--light-gray);border-radius:8px;font-size:16px">
        <button type="submit" class="btn btn--primary" style="flex-shrink:0">Search</button>
      </form>
    </header>

    {{{home_html}}}

    {{components_bottom}}
  </div>
</div>

<section class="page-header">
  <div class="container">

    <h1>{{category}}</h1>

    <p class="page-description">
      {{description}}
    </p>

  </div>
</section>

<section class="authors-section">
  <div class="container">

    <div class="authors-section__header">

      <h2>Our Authors</h2>

      <span class="authors-count">
        {{author_count}} authors
      </span>

    </div>

    <div class="authors-grid">
      {{author_cards}}
    </div>

  </div>
</section>

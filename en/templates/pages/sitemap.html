<main class="sitemap-page">

<section class="sitemap-hero">
    <div class="container">
        <h1>{{sm_title}}</h1>
        <p>{{sm_intro}}</p>
    </div>
</section>


<section class="container sitemap-grid">


<div class="sitemap-card">
    <div class="sitemap-icon">🎰</div>
    <h2>{{sm_casinos_title}}</h2>
    <p>{{sm_casinos_text}}</p>
    <ul id="casinos"></ul>
</div>


<div class="sitemap-card">
    <div class="sitemap-icon">⭐</div>
    <h2>{{sm_reviews_title}}</h2>
    <p>{{sm_reviews_text}}</p>
    <ul id="reviews"></ul>
</div>


<div class="sitemap-card">
    <div class="sitemap-icon">📰</div>
    <h2>{{sm_news_title}}</h2>
    <p>{{sm_news_text}}</p>
    <ul id="news"></ul>
</div>


<div class="sitemap-card">
    <div class="sitemap-icon">📚</div>
    <h2>{{sm_pages_title}}</h2>
    <p>{{sm_pages_text}}</p>
    <ul id="pages"></ul>
</div>


</section>

</main>


<script>
async function loadSitemap(){

const sections=[
["casinos","/en/sitemap-casinos.xml"],
["reviews","/en/sitemap-reviews.xml"],
["news","/en/sitemap-news.xml"],
["pages","/en/sitemap-pages.xml"]
];


for(const [id,url] of sections){

try {

const res=await fetch(url);
const xml=await res.text();

const doc=new DOMParser()
.parseFromString(xml,"application/xml");


const urls=[...doc.querySelectorAll("loc")];


document.getElementById(id).innerHTML =
urls.map(u=>{

const currentOrigin = window.location.origin;

const path = u.textContent
  .replace(currentOrigin, "")
  .replace("/en/", "")
  .replaceAll("-", " ");


return `
<li>
<a href="${u.textContent}">
${path}
</a>
</li>
`;

}).join("");


}catch(e){

console.error("Sitemap loading failed",id,e);

}

}

}

loadSitemap();

</script>

<!-- LAYOUT -->
<!-- ================================================== -->

<h3 id="layout">Layout</h3>


<div class="form-group">

  <label>Container Width</label>

  <select name="theme_container_width">

    <option value="1080px">
      Compact
    </option>

    <option value="1200px" selected>
      Standard
    </option>

    <option value="1440px">
      Wide
    </option>

  </select>

</div>


<div class="form-group">

  <label>Header Style</label>

  <select name="theme_header_style">

    <option value="default">
      Default
    </option>

    <option value="solid">
      Solid
    </option>

    <option value="glass">
      Glass
    </option>

    <option value="transparent">
      Transparent
    </option>

  </select>

</div>


<div class="form-group">

  <label>Card Style</label>

  <select name="theme_card_style">

    <option value="default">
      Default
    </option>

    <option value="flat">
      Flat
    </option>

    <option value="bordered">
      Bordered
    </option>

    <option value="glass">
      Glass
    </option>

    <option value="elevated">
      Elevated
    </option>

  </select>

</div>


<div class="form-group">

  <label>Button Style</label>

  <select name="theme_button_style">

    <option value="default">
      Default
    </option>

    <option value="rounded">
      Rounded
    </option>

    <option value="pill">
      Pill
    </option>

    <option value="square">
      Square
    </option>

  </select>

</div>


<div class="form-group">

  <label>Layout Style</label>

  <select name="theme_layout_style">

    <option value="default">
      Default
    </option>

    <option value="compact">
      Compact
    </option>

    <option value="wide">
      Wide
    </option>

  </select>

</div>


<div class="form-grid">

  <div class="form-group">

    <label>Card Radius</label>

    <input
      type="text"
      name="theme_card_radius"
      placeholder="12px"
    >

  </div>


  <div class="form-group">

    <label>Button Radius</label>

    <input
      type="text"
      name="theme_button_radius"
      placeholder="8px"
    >

  </div>

</div>



      <h2 id="responsible-gambling">Responsible Gambling</h2>

      <div class="form-group">
        <label>Responsible Gambling Text</label>
        <input
          type="text"
          name="footer_responsible_text"
          placeholder="18+ | Gambling can be addictive, please play responsibly."
        >
      </div>

      <div class="form-group">
        <label>Responsible Gambling Page URL</label>
        <input
          type="text"
          name="footer_responsible_url"
          placeholder="/en/responsible-gambling"
        >
      </div>

      <div class="form-group">
        <label>Help Text</label>
        <input
          type="text"
          name="footer_responsible_help_text"
          placeholder="If you or someone you know needs help, visit"
        >
      </div>

      <div class="form-group">
        <label>Help Organization URL</label>
        <input
          type="url"
          name="footer_responsible_help_url"
          placeholder="https://..."
        >
      </div>

      <div class="form-group">
        <label>Help Organization Label</label>
        <input
          type="text"
          name="footer_responsible_help_label"
          placeholder="GambleAware.org"
        >
      </div>

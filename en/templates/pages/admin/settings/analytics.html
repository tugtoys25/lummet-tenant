      <h2 id="analytics">Analytics</h2>

      <div class="form-group">
        <label>Google Tag IDs</label>
        <input
          type="text"
          name="ga_measurement_id"
          placeholder="G-XXXXXXXXXX, GT-XXXXXXXX"
        >
        <p class="muted">
          Enter your GA4 Measurement ID, optionally followed by a
          Google Tag / container ID separated by a comma (e.g.
          G-E0ZDHXWWX7, GT-PLFFPKPD). Leave blank to disable tracking.
        </p>
      </div>

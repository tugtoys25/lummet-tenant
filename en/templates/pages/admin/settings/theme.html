      <!-- ================================================== -->
<!-- PLATFORM THEME -->
<!-- ================================================== -->

<h2 id="theme">Platform Theme</h2>

<p class="muted">
  Customize the visual identity and layout of this tenant.
  Changes apply across the public website.
</p>


<div class="form-group">

  <label>Theme Preset</label>

  <select name="theme_preset" id="themePreset">

    <option value="midnight">
      Midnight
    </option>

    <option value="ocean">
      Ocean
    </option>

    <option value="emerald">
      Emerald
    </option>

    <option value="ruby">
      Ruby
    </option>

    <option value="gold">
      Gold
    </option>

    <option value="light">
      Light
    </option>

    <option value="custom">
      Custom
    </option>

  </select>

</div>


<div class="form-grid">

  <div class="form-group">

    <label>Primary Color</label>

    <input
      type="color"
      name="theme_primary"
      id="themePrimary"
      value="#8b5cf6"
    >

  </div>


  <div class="form-group">

    <label>Primary Hover</label>

    <input
      type="color"
      name="theme_primary_hover"
      id="themePrimaryHover"
      value="#7c3aed"
    >

  </div>


  <div class="form-group">

    <label>Secondary Color</label>

    <input
      type="color"
      name="theme_secondary"
      id="themeSecondary"
      value="#ec4899"
    >

  </div>


  <div class="form-group">

    <label>Secondary Hover</label>

    <input
      type="color"
      name="theme_secondary_hover"
      id="themeSecondaryHover"
      value="#db2777"
    >

  </div>


  <div class="form-group">

    <label>Accent Color</label>

    <input
      type="color"
      name="theme_accent"
      id="themeAccent"
      value="#22d3ee"
    >

  </div>


  <div class="form-group">

    <label>Page Background</label>

    <input
      type="color"
      name="theme_background"
      id="themeBackground"
      value="#050505"
    >

  </div>


  <div class="form-group">

    <label>Card / Surface</label>

    <input
      type="color"
      name="theme_surface"
      id="themeSurface"
      value="#0f0f12"
    >

  </div>


  <div class="form-group">

    <label>Alternative Surface</label>

    <input
      type="color"
      name="theme_surface_alt"
      id="themeSurfaceAlt"
      value="#15151a"
    >

  </div>


  <div class="form-group">

    <label>Main Text</label>

    <input
      type="color"
      name="theme_text"
      id="themeText"
      value="#ffffff"
    >

  </div>


  <div class="form-group">

    <label>Muted Text</label>

    <input
      type="color"
      name="theme_text_muted"
      id="themeTextMuted"
      value="#a1a1aa"
    >

  </div>


  <div class="form-group">

    <label>Border</label>

    <input
      type="color"
      name="theme_border"
      id="themeBorder"
      value="#27272a"
    >

  </div>


  <div class="form-group">

    <label>Button Text</label>

    <input
      type="color"
      name="theme_button_text"
      id="themeButtonText"
      value="#ffffff"
    >

  </div>

</div>

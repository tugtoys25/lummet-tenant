      <!-- GENERAL -->
      <!-- ================================================== -->

      <h2 id="general">General</h2>

      <div class="form-group">
        <label>Site Name</label>
        <input
          type="text"
          name="site_name"
          placeholder="{{site_name}}"
        >
      </div>

      <div class="form-group">
        <label>Site Title</label>
        <input
          type="text"
          name="site_title"
          placeholder="Homepage title shown in search results and browser tab"
        >
      </div>

      <div class="form-group">
        <label>Site URL</label>
        <input
          type="url"
          name="site_url"
          placeholder="{{site_url}}"
        >
      </div>

      <div class="form-group">
        <label>Site Description</label>
        <textarea
          name="site_description"
          rows="3"
          placeholder="Short description of this website"
        ></textarea>
      </div>

      <div class="form-group">
        <label>Contact Email</label>
        <input
          type="email"
          name="contact_email"
        >
      </div>

      <div class="form-group">
        <label>Default Country</label>
        <input
          type="text"
          name="default_country"
          placeholder="RW"
        >
      </div>

      <div class="form-group">
        <label>Country Directory — Featured Section Label</label>
        <input
          type="text"
          name="country_directory_featured_label"
          placeholder="Featured Gambling Markets"
        >
        <small class="muted">Heading shown above the featured countries on /en/country. Change anytime without a deploy — mark countries "Featured" from the Countries page.</small>
      </div>

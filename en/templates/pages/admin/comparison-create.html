<div class="admin-wrapper">
  {{admin_nav}}

  <div class="admin-content">
    <div class="admin-header">
      <h1>Add Comparison</h1>
      <a href="/en/dashboard/comparisons" class="btn btn--ghost">Back to List</a>
    </div>

    <div id="comparisonFormAlert" class="alert" style="display:none"></div>

    <form id="comparisonForm" class="admin-form">
      <label>Content Type
        <select name="content_type" required>
          <option value="casino">Casino</option>
          <option value="sportsbook">Sportsbook</option>
          <option value="affiliate_partner">Affiliate Partner</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <label>Title <input type="text" name="title" required></label>
      <label>Slug <input type="text" name="slug" required pattern="[a-z0-9-]+"></label>
      <label>Description <textarea name="description" rows="3"></textarea></label>
      <label>Status
        <select name="status">
          <option value="draft">Draft</option>
          <option value="pending_review">Pending Review</option>
          <option value="approved">Approved</option>
          <option value="published">Published / Active</option>
          <option value="archived">Archived</option>
        </select>
      </label>

      <fieldset>
        <legend>Items to Compare</legend>
        <p class="muted">Search by name instead of entering a numeric ID.</p>
        <label>Search within
          <select id="itemSearchContentType">
            <option value="casino">Casino</option>
            <option value="sportsbook">Sportsbook</option>
            <option value="affiliate_partner">Affiliate Partner</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <div style="display:flex;gap:8px;margin:8px 0">
          <input type="text" id="itemSearchInput" placeholder="Search items to add..." style="flex:1">
        </div>
        <div id="itemSearchResults" style="margin-bottom:12px"></div>
        <div id="selectedItemRows"></div>
      </fieldset>

      <fieldset>
        <legend>Criteria (rows shown on the comparison page)</legend>
        <div id="criterionRows"></div>
        <button type="button" id="addCriterionRowBtn" class="btn btn--ghost btn--sm">+ Add Criterion</button>
      </fieldset>

      <fieldset>
        <legend>Editorial Pick (optional)</legend>
        <label>Item Content Type
          <select name="editorial_selection_item_type" id="editorialPickContentType">
            <option value="">None</option>
            <option value="casino">Casino</option>
            <option value="sportsbook">Sportsbook</option>
            <option value="affiliate_partner">Affiliate Partner</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <input type="hidden" name="editorial_selection_item_id" id="editorialPickItemId">
        <p class="muted">Search by name instead of entering a numeric ID.</p>
        <input type="text" id="editorialPickSearchInput" placeholder="Search for the item to feature...">
        <div id="editorialPickSearchResults" style="margin:6px 0"></div>
        <div id="editorialPickSelected" class="muted">No item selected.</div>
      </fieldset>

      <fieldset>
        <legend>SEO</legend>
        <label>SEO Title <input type="text" name="seo_title"></label>
        <label>SEO Description <textarea name="seo_description" rows="2"></textarea></label>
      </fieldset>

      <button type="submit" class="btn btn--primary">Create Comparison</button>
    </form>
  </div>
</div>

<template id="selectedItemRowTemplate">
  <div class="item-row" style="display:flex;gap:8px;margin-bottom:6px;align-items:center;padding:6px 10px;background:var(--bg,#f5f5f5);border-radius:6px">
    <span class="item-row-label" style="flex:1"></span>
    <button type="button" class="btn btn--ghost btn--sm remove-selected-item">✕</button>
  </div>
</template>

<template id="criterionRowTemplate">
  <div class="criterion-row" style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
    <input type="text" class="criterion-key" placeholder="key (e.g. license)" style="flex:1">
    <input type="text" class="criterion-label" placeholder="Label (e.g. License)" style="flex:1">
    <button type="button" class="btn btn--ghost btn--sm remove-criterion-row">✕</button>
  </div>
</template>

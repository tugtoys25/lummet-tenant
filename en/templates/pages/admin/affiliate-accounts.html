<div class="admin-wrapper">
  {{admin_nav}}
  <div class="admin-content">
    <div class="admin-header">
      <h1>Affiliate Accounts</h1>
    </div>

    <div class="form-row" style="margin-bottom:16px">
      <div class="form-group">
        <label>Filter by Program</label>
        <select id="accountProgramFilter"><option value="">All Programs</option></select>
      </div>
    </div>

    <table class="admin-table">
      <thead>
        <tr><th>Account</th><th>Program</th><th>Status</th><th>External ID</th><th>Actions</th></tr>
      </thead>
      <tbody id="accountsTableBody">
        <tr><td colspan="5" class="muted">Loading...</td></tr>
      </tbody>
    </table>

    <h2 style="margin-top:30px">Add / Edit Account</h2>
    <form id="accountForm" class="admin-form">
      <input type="hidden" name="id" id="accountId" value="">
      <div class="form-row">
        <div class="form-group">
          <label>Program *</label>
          <select name="program_id" id="accountProgramSelect" required></select>
        </div>
        <div class="form-group">
          <label>Account Name *</label>
          <input type="text" name="account_name" required placeholder="Sub-affiliate ID 4471">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>External Account ID</label>
          <input type="text" name="external_account_id">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select name="status">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="archived">Archived</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Portal URL</label>
        <input type="text" name="portal_url">
      </div>
      <div class="form-group">
        <label>Credential Reference</label>
        <input type="text" name="credential_reference" placeholder="e.g. secret-store key name — never a real password or API key">
        <p class="muted" style="margin-top:4px">This is a pointer to where the real credential is stored, not the credential itself. Never paste an actual password, token, or API key into this field.</p>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes"></textarea>
      </div>
      <div id="accountFormAlert" class="alert" style="display:none"></div>
      <div style="display:flex;gap:12px">
        <button type="submit" class="btn btn--primary btn--lg" id="accountSubmitBtn">Create Account</button>
        <button type="button" class="btn btn--ghost btn--lg" id="accountCancelEdit" style="display:none" onclick="cancelAccountEdit()">Cancel Edit</button>
      </div>
    </form>
  </div>
</div>

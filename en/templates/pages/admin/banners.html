<div class="admin-wrapper">
  {{admin_nav}}
  <div class="admin-content">
    <div class="admin-header">
      <h1>Banner Management</h1>
    </div>

    <div class="lb-tabs" role="tablist" aria-label="Banner types" data-lb-tablist>
      <button type="button" class="btn btn--sm" role="tab" id="lbTabSite" data-lb-tab="site" aria-controls="lbPanelSite" aria-selected="true">Site bars</button>
      <button type="button" class="btn btn--sm" role="tab" id="lbTabLive" data-lb-tab="live" aria-controls="lbPanelLive" aria-selected="false" tabindex="-1">Live banners</button>
    </div>

    <div id="lbPanelSite" role="tabpanel" aria-labelledby="lbTabSite" data-lb-panel="site">

    <table class="admin-table">
      <thead>
        <tr><th>Title</th><th>Type</th><th>Position</th><th>Geo</th><th>Enabled</th><th>Actions</th></tr>
      </thead>
      <tbody id="bannersTableBody">
        <tr><td colspan="6" class="muted">Loading...</td></tr>
      </tbody>
    </table>

    <h2 style="margin-top:30px">Add / Edit Banner</h2>
    <form id="bannerForm" class="admin-form">
      <input type="hidden" name="id" id="bannerId" value="">
      <div class="form-row">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" name="title" required placeholder="Welcome Offer!">
        </div>
        <div class="form-group">
          <label>Type</label>
          <select name="type">
            <option value="announcement">Announcement</option>
            <option value="promotion">Promotion</option>
            <option value="geo">Geo-Targeted</option>
            <option value="cookie">Cookie Notice</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Content</label>
        <textarea name="content" placeholder="Get 100% bonus on your first deposit..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Button Text</label>
          <input type="text" name="button_text" placeholder="Claim Now">
        </div>
        <div class="form-group">
          <label>Link</label>
          <input type="text" name="link" placeholder="/en/casino/bcgame">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Background Color</label>
          <input type="color" name="bg_color" value="#6c5ce7">
        </div>
        <div class="form-group">
          <label>Text Color</label>
          <input type="color" name="text_color" value="#ffffff">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Position</label>
          <select name="position">
            <option value="top">Top (above header)</option>
            <option value="bottom">Bottom (above footer)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Dismissible?</label>
          <select name="dismissible">
            <option value="1">Yes</option>
            <option value="0">No</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Geo Countries (comma-separated codes, empty = all)</label>
        <input type="text" name="geo_countries" placeholder="US,CA,GB">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Start Date (empty = now)</label>
          <input type="datetime-local" name="start_date">
        </div>
        <div class="form-group">
          <label>End Date (empty = forever)</label>
          <input type="datetime-local" name="end_date">
        </div>
      </div>
      <div class="form-group">
        <label>Enabled</label>
        <select name="enabled">
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>
      <div id="bannerFormAlert" class="alert" style="display:none"></div>
      <div style="display:flex;gap:12px">
        <button type="submit" class="btn btn--primary btn--lg" id="bannerSubmitBtn">Create Banner</button>
        <button type="button" class="btn btn--ghost btn--lg" id="bannerCancelEdit" style="display:none" onclick="cancelBannerEdit()">Cancel Edit</button>
      </div>
    </form>
    </div>

    <div id="lbPanelLive" role="tabpanel" aria-labelledby="lbTabLive" data-lb-panel="live" hidden>
      <div id="lbMessage" class="alert" role="status" hidden></div>
      <div id="lbListView">
        <div class="lb-row"><button type="button" class="btn btn--primary" id="lbNew">New banner</button></div>
        <table class="admin-table">
          <thead><tr><th>Name</th><th>Status</th><th>Template</th><th>Placement</th><th>Priority</th><th>Views</th><th>Clicks</th><th>CTR</th><th>Actions</th></tr></thead>
          <tbody id="lbListBody"><tr><td colspan="9" class="muted">Loading...</td></tr></tbody>
        </table>
      </div>
      <div id="lbEditorView" hidden>
        <div class="lb-row"><button type="button" class="btn btn--ghost btn--sm" id="lbBack">&larr; All banners</button><h2 id="lbEditorTitle">New banner</h2></div>
        <div class="lb-editor">
          <form id="lbEditorForm" class="admin-form">
            <div id="lbSections"></div>
            <div class="lb-row">
              <button type="button" class="btn btn--ghost btn--lg" id="lbSaveDraft">Save draft</button>
              <button type="button" class="btn btn--primary btn--lg" id="lbPublish">Publish</button>
              <button type="button" class="btn btn--ghost btn--lg" id="lbPause">Pause</button>
              <button type="button" class="btn btn--ghost btn--lg" id="lbDuplicate">Duplicate</button>
            </div>
          </form>
          <div id="lbPreviewHost"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="admin-wrapper">
  {{admin_nav}}
  <div class="admin-content">
    <div class="admin-header"><h1>Authors</h1></div>
    <table class="admin-table">
      <thead><tr><th>Name</th><th>Slug</th><th>Role</th><th>Published</th><th>Actions</th></tr></thead>
      <tbody id="authorsTableBody"><tr><td colspan="5" class="muted">Loading...</td></tr></tbody>
    </table>

    <h2 style="margin-top:30px">Add Author</h2>
    <form id="authorForm" class="admin-form">
      <input type="hidden" name="id" id="authorId" value="">
      <div class="form-row">
        <div class="form-group"><label>Name *</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Slug *</label><input type="text" name="slug" required placeholder="elie-bizimana"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Role</label><input type="text" name="role" value="Editor" placeholder="Founder, Analyst, etc."></div>
        <div class="form-group"><label>Email</label><input type="email" name="email"></div>
      </div>
      <div class="form-group"><label>Avatar URL</label><input type="text" name="avatar_url" placeholder="https://..."></div>
      <div class="form-group"><label>Bio</label><textarea name="bio" placeholder="Author biography..."></textarea></div>
      <div class="form-group"><label>Social Links (HTML)</label><input type="text" name="social_links" placeholder='<a href="https://x.com/...">X</a>'></div>
      <div class="form-row">
        <div class="form-group"><label>SEO Title</label><input type="text" name="seo_title"></div>
        <div class="form-group"><label>SEO Description</label><input type="text" name="seo_description"></div>
      </div>
      <div class="form-group">
        <label>Published</label>
        <select name="published">
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>
      <div id="authorFormAlert" class="alert" style="display:none"></div>
      <div style="display:flex;gap:12px">
        <button type="submit" class="btn btn--primary btn--lg" id="authorSubmitBtn">Create Author</button>
        <button type="button" class="btn btn--ghost btn--lg" id="authorCancelEdit" style="display:none" onclick="cancelAuthorEdit()">Cancel Edit</button>
      </div>
    </form>
  </div>
</div>

<div class="admin-wrapper">
  {{admin_nav}}
  <div class="admin-content">
    <div class="admin-header"><h1>Pages</h1></div>
    <table class="admin-table">
      <thead><tr><th>Title</th><th>Slug</th><th>Type</th><th>Actions</th></tr></thead>
      <tbody id="pagesTableBody"><tr><td colspan="4" class="muted">Loading...</td></tr></tbody>
    </table>

    <h2 style="margin-top:30px">Add Page</h2>
    <form id="pageForm" class="admin-form">
      <input type="hidden" name="id" id="pageId" value="">
      <div class="form-row">
        <div class="form-group"><label>Slug *</label><input type="text" name="slug" required placeholder="about"></div>
        <div class="form-group"><label>Type *</label><input type="text" name="type" required value="page"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Template *</label><input type="text" name="template" required value="page"></div>
        <div class="form-group"><label>Title *</label><input type="text" name="title" required></div>
        <div class="form-group">
          <label>Author</label>
          <select name="author_id" id="pageAuthorSelect">
            <option value="">No author assigned</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Content</label><textarea name="content_json" placeholder="Your content here" data-rich-editor data-editor-id="page-content" data-editor-folder="pages"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>SEO Title</label><input type="text" name="seo_title"></div>
        <div class="form-group"><label>SEO Description</label><input type="text" name="seo_description"></div>
      </div>
      <div class="form-group"><label>SEO Keywords</label><input type="text" name="seo_keywords" placeholder="comma, separated, keywords"></div>
      <div id="pageFormAlert" class="alert" style="display:none"></div>
      <div style="display:flex;gap:12px">
        <button type="submit" class="btn btn--primary btn--lg" id="pageSubmitBtn">Create Page</button>
        <button type="button" class="btn btn--ghost btn--lg" id="pageCancelEdit" style="display:none" onclick="cancelPageEdit()">Cancel Edit</button>
      </div>
    </form>
  </div>
</div>

<div class="admin-wrapper">
  {{admin_nav}}
  <div class="admin-content">
    <div class="admin-header">
      <h1>Media Library</h1>
    </div>
<!--    <div class="admin-card">
      <h2>Media Library</h2>
      <div id="media-library-container"></div>
    </div>-->
<div class="admin-card">

  <h2>Media Library</h2>

  <!-- Existing full Media Library -->
  <div id="media-library-container"></div>

  <!-- Legacy external-image source form -->
  <div class="admin-card" style="margin-top:24px;">

    <h3>Add Image from External URL</h3>

    <p class="muted">
      Add an externally hosted image to the media library without uploading
      the file to your storage.
    </p>

    <form id="mediaForm">

      <div class="form-group">
        <label for="media-url">Image URL *</label>
        <input
          type="url"
          id="media-url"
          name="url"
          required
          placeholder="https://example.com/image.webp"
        >
      </div>

      <div class="form-group">
        <label for="media-filename">Filename *</label>
        <input
          type="text"
          id="media-filename"
          name="filename"
          required
          placeholder="example.webp"
        >
      </div>

      <div class="form-group">
        <label for="media-thumbnail-url">
          Thumbnail URL
        </label>

        <input
          type="url"
          id="media-thumbnail-url"
          name="thumbnail_url"
          placeholder="https://example.com/thumbnail.webp"
        >

        <small class="muted">
          Optional. If empty, the main image URL is used.
        </small>
      </div>

      <div class="form-group">
        <label for="media-folder">Folder</label>

        <input
          type="text"
          id="media-folder"
          name="folder"
          value="general"
          placeholder="general"
        >
      </div>

      <div class="form-group">
        <label for="media-alt-text">Alt Text</label>

        <input
          type="text"
          id="media-alt-text"
          name="alt_text"
          placeholder="Describe this image"
        >
      </div>

      <div
        id="mediaFormAlert"
        class="alert"
        style="display:none;margin-bottom:16px;"
      ></div>

      <button
        type="submit"
        class="btn btn--primary"
      >
        Add Image URL
      </button>

    </form>

  </div>

</div>

  </div>
</div>

<script src="/static/js/media-library.js"></script>
<script src="/static/js/media-picker.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.MediaLibrary) {
      MediaLibrary.init('media-library-container');
    }
  });
</script>

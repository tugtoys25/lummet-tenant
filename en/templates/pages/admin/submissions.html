<div class="admin-wrapper">
  {{admin_nav}}
  <div class="admin-content">
    <div class="admin-header">
      <h1>Casino Submissions</h1>
    </div>

    <div style="margin-bottom:20px;display:flex;gap:8px">
      <button class="btn btn--ghost btn--sm" onclick="filterSubmissions('')">All</button>
      <button class="btn btn--ghost btn--sm" onclick="filterSubmissions('pending')">Pending</button>
      <button class="btn btn--ghost btn--sm" onclick="filterSubmissions('approved')">Approved</button>
      <button class="btn btn--ghost btn--sm" onclick="filterSubmissions('rejected')">Rejected</button>
    </div>

    <div id="submissionsContainer">
      <p class="muted">Loading...</p>
    </div>

    <!-- Review Modal -->
    <div id="submissionModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center" onclick="if(event.target===this)this.style.display='none'">
      <div style="background:var(--white);border-radius:var(--radius);padding:30px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto">
        <h3 style="margin-bottom:16px">Review Submission</h3>
        <div id="submissionModalDetails" style="background:var(--bg);border-radius:8px;padding:16px;margin-bottom:20px"></div>
        <div class="form-group" style="margin-bottom:20px">
          <label>Admin Notes (optional)</label>
          <textarea id="submissionModalNotes" style="min-height:80px" placeholder="Notes for the user..."></textarea>
        </div>
        <div style="display:flex;gap:12px">
          <button class="btn btn--primary" onclick="updateSubmission('approved')">Approve</button>
          <button class="btn btn--danger" onclick="updateSubmission('rejected')">Reject</button>
          <button class="btn btn--ghost" onclick="document.getElementById('submissionModal').style.display='none'">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

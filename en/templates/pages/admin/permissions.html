<div class="admin-wrapper">
  {{admin_nav}}
  <div class="admin-content">
    <div class="admin-header">
      <h1>Role Permissions</h1>
    </div>

    <div class="form-group" style="margin-bottom:24px;max-width:300px">
      <label>Select Role to Edit</label>
      <select id="permRoleSelect" onchange="loadPermissionMatrix()">
        <option value="editor">Editor</option>
        <option value="viewer">Viewer</option>
      </select>
    </div>

    <div id="permAlert" class="alert" style="display:none;margin-bottom:20px"></div>

    <div style="overflow-x:auto">
      <table class="admin-table" id="permTable">
        <thead>
          <tr>
            <th>Resource</th>
            <th style="text-align:center">Create</th>
            <th style="text-align:center">Read</th>
            <th style="text-align:center">Update</th>
            <th style="text-align:center">Delete</th>
          </tr>
        </thead>
        <tbody id="permTableBody">
          <tr><td colspan="5" class="muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div style="margin-top:20px">
      <button class="btn btn--primary btn--lg" onclick="savePermissions()">Save Permissions</button>
    </div>

    <div class="admin-section" style="margin-top:40px">
      <h2>Available Roles</h2>
      <table class="admin-table">
        <thead>
          <tr><th>Role</th><th>Description</th></tr>
        </thead>
        <tbody>
          <tr><td><strong>admin</strong></td><td>Full access to everything. Cannot be modified.</td></tr>
          <tr><td><strong>editor</strong></td><td>Can manage reviews, news, pages. Read-only on casinos and settings.</td></tr>
          <tr><td><strong>viewer</strong></td><td>Read-only access to dashboard. No write permissions.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

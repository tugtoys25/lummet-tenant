<section class="auth-page">
  <div class="container">
    <div class="auth-card">
      <h1>{{ac_forgot_title}}</h1>
      <p class="auth-lead">{{ac_forgot_lead}}</p>
      <form id="forgotPasswordForm" class="auth-form">
        <div class="form-group">
          <label>{{ac_forgot_email}}</label>
          <input type="email" name="email" required>
        </div>
        <button type="submit" class="btn btn--primary btn--block">{{ac_forgot_button}}</button>
      </form>
      <p class="auth-footer"><a href="/en/login">{{ac_back_to_login}}</a></p>
      <div id="forgotPasswordError" class="alert alert--error" style="display:none"></div>
      <div id="forgotPasswordSuccess" class="alert alert--success" style="display:none"></div>
    </div>
  </div>
</section>

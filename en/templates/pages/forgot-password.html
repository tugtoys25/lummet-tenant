<section class="auth-page">
  <div class="container">
    <div class="auth-card">
      <h1>Forgot Password</h1>
      <p class="auth-lead">Enter the email address on your account and we'll send you a link to reset your password.</p>
      <form id="forgotPasswordForm" class="auth-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Send Reset Link</button>
      </form>
      <p class="auth-footer"><a href="/en/login">Back to login</a></p>
      <div id="forgotPasswordError" class="alert alert--error" style="display:none"></div>
      <div id="forgotPasswordSuccess" class="alert alert--success" style="display:none"></div>
    </div>
  </div>
</section>

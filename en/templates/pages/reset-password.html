<section class="auth-page">
  <div class="container">
    <div class="auth-card">
      <h1>{{ac_reset_title}}</h1>
      <form id="resetPasswordForm" class="auth-form">
        <input type="hidden" name="token" value="{{token}}">
        <div class="form-group">
          <label>{{ac_reset_password}}</label>
          <input type="password" name="password" required minlength="8">
        </div>
        <div class="form-group">
          <label>{{ac_reset_confirm}}</label>
          <input type="password" name="passwordConfirm" required minlength="8">
        </div>
        <button type="submit" class="btn btn--primary btn--block">{{ac_reset_button}}</button>
      </form>
      <p class="auth-footer"><a href="/en/login">{{ac_back_to_login}}</a></p>
      <div id="resetPasswordError" class="alert alert--error" style="display:none"></div>
      <div id="resetPasswordSuccess" class="alert alert--success" style="display:none"></div>
    </div>
  </div>
</section>

<section class="auth-page">
  <div class="container">
    <div class="auth-card">
      <h1>Reset Password</h1>
      <form id="resetPasswordForm" class="auth-form">
        <input type="hidden" name="token" value="{{token}}">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" name="password" required minlength="8">
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" name="passwordConfirm" required minlength="8">
        </div>
        <button type="submit" class="btn btn--primary btn--block">Reset Password</button>
      </form>
      <p class="auth-footer"><a href="/en/login">Back to login</a></p>
      <div id="resetPasswordError" class="alert alert--error" style="display:none"></div>
      <div id="resetPasswordSuccess" class="alert alert--success" style="display:none"></div>
    </div>
  </div>
</section>

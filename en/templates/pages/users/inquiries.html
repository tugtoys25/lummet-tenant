<div class="admin-wrapper">
  {{user_nav}}
  <div class="admin-content">
    <div class="admin-header dash-page-head">
      <div>
        <h1>My Inquiries</h1>
        <p class="dash-page-sub">Ask the team a question and follow the replies here.</p>
      </div>
    </div>

    <div class="dash-split">
      <form id="inquiryForm" class="admin-form dash-form" novalidate>
        <h2>Send a New Inquiry</h2>
        <p class="dash-form-intro">We usually reply here and you will see a notification when we do.</p>
        <div class="form-group">
          <label for="inquirySubject">Subject <span class="dash-req" aria-hidden="true">*</span></label>
          <input type="text" id="inquirySubject" name="subject" required maxlength="150" placeholder="Question about a casino" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="inquiryMessage">Message <span class="dash-req" aria-hidden="true">*</span></label>
          <textarea id="inquiryMessage" name="message" required maxlength="4000" placeholder="Your question or concern..."></textarea>
        </div>
        <div id="inquiryFormAlert" class="alert" role="alert" style="display:none"></div>
        <div class="dash-form-actions">
          <button type="submit" class="btn btn--primary">Send Inquiry</button>
        </div>
      </form>

      <div>
        <div class="dash-tabs" id="inquiryTabs" role="group" aria-label="Filter inquiries">
          <button type="button" class="dash-tab" data-filter="" aria-pressed="true">All <span class="dash-tab-count" data-count="all">0</span></button>
          <button type="button" class="dash-tab" data-filter="pending" aria-pressed="false">Pending <span class="dash-tab-count" data-count="pending">0</span></button>
          <button type="button" class="dash-tab" data-filter="answered" aria-pressed="false">Answered <span class="dash-tab-count" data-count="answered">0</span></button>
        </div>
        <div id="inquiriesList" aria-live="polite">
          <div class="dash-skel dash-skel-row"></div>
          <div class="dash-skel dash-skel-row"></div>
        </div>
      </div>
    </div>
  </div>
</div>

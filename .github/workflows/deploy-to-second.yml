name: Deploy Development Workers - Account 2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development-account-2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.worker }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        worker:
          - freewin
          - lummet
          - clustercasino
          - neuroodds
          - legendodds
          - brilliantodds
          - blucca

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy freewin
        if: matrix.worker == 'freewin'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.SECOND_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.SECOND_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.account2.jsonc

      - name: Deploy environment worker
        if: matrix.worker != 'freewin'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.SECOND_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.SECOND_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --env ${{ matrix.worker }} --config wrangler.account2.jsonc

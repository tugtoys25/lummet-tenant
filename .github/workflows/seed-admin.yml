name: Seed Freewin Admin

on:
  workflow_dispatch:

jobs:
  seed-admin:
    name: Create Freewin Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Generate password hash
        run: |
          node <<'EOF' > /tmp/password-hash.txt
          const crypto = require("crypto");

          const password = "REMOVED_EXPOSED_PASSWORD";
          const salt = crypto.randomBytes(16);

          const hash = crypto.pbkdf2Sync(
            password,
            salt,
            100000,
            32,
            "sha256"
          );

          console.log(
            `${salt.toString("hex")}:${hash.toString("hex")}`
          );
          EOF

      - name: Seed admin into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          HASH=$(cat /tmp/password-hash.txt)

          npx wrangler d1 execute freewin-db \
            --remote \
            --command "
              INSERT INTO users (
                email,
                password_hash,
                role
              )
              VALUES (
                'admin@freewin.xyz',
                '$HASH',
                'admin'
              )
              ON CONFLICT(email) DO UPDATE SET
                password_hash = excluded.password_hash,
                role = 'admin',
                updated_at = CURRENT_TIMESTAMP;
            "

      - name: Verify admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute freewin-db \
            --remote \
            --command "
              SELECT id, email, role, created_at, updated_at
              FROM users
              WHERE email = 'admin@freewin.xyz';
            "
